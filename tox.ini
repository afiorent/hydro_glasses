[tox]
env_list = lint, test, docs

[testenv:lint]
skip_install = true
deps = ruff
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/

[testenv:test]
deps =
    pytest
    numpy
    scipy
    opt_einsum
    ase
    pandas
extras = parallel
commands =
    pytest {posargs}

[testenv:docs]
deps =
    sphinx>=9
    myst-parser>=5
    myst-nb>=1
    furo
    sphinx-autodoc-typehints
extras = plot
commands =
    sphinx-build -b html docs docs/_build/html -W --keep-going {posargs}
